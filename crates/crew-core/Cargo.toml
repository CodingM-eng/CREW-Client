[package]
name = "crew-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CREW Client foundational types, Maven resolver, checksum validation, version sorting, and HTTP client"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "2", features = ["json", "tls"], default-features = false }

[lints]
workspace = true
