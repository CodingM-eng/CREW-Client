<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c13"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333c54"/>
      <stop offset="100%" stop-color="#181c28"/>
    </linearGradient>
    <linearGradient id="crewChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="crewAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3355"/>
      <stop offset="50%" stop-color="#e61438"/>
      <stop offset="100%" stop-color="#aa0022"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="6"/>

  <!-- Outer CREW Crest Structure (Chiseled Gaming Bracket C) -->
  <path d="M 130 140 L 350 140 L 385 185 L 320 185 L 195 185 L 195 327 L 320 327 L 385 327 L 350 372 L 130 372 Z" fill="url(#crewChrome)"/>

  <!-- Top & Bottom Aerodynamic Gaming Winglets -->
  <polygon points="330,140 375,140 355,170 310,170" fill="url(#crewAccent)"/>
  <polygon points="310,342 355,342 375,372 330,372" fill="url(#crewAccent)"/>

  <!-- Inner Dynamic Velocity Arrow / Core -->
  <path d="M 230 215 L 320 256 L 230 297 L 230 270 L 275 256 L 230 242 Z" fill="url(#crewAccent)" filter="url(#glow)"/>
</svg>
