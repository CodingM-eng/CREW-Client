name: CREW Client Website Deploy

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    name: Validate and Deploy to Cloudflare Pages
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Website Files
        run: |
          echo "=== Checking Website Structure ==="
          test -f website/index.html || { echo "index.html missing"; exit 1; }
          test -f website/indir/index.html || { echo "indir/index.html missing"; exit 1; }
          test -f website/surumler/index.html || { echo "surumler/index.html missing"; exit 1; }
          test -f website/dokumanlar/index.html || { echo "dokumanlar/index.html missing"; exit 1; }
          test -f website/_headers || { echo "_headers missing"; exit 1; }
          test -f website/assets/css/style.css || { echo "style.css missing"; exit 1; }
          test -f website/assets/js/main.js || { echo "main.js missing"; exit 1; }
          echo "All core website files validated successfully."

      - name: Upload Website Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crew-client-website
          path: website/
          retention-days: 7

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=crew-client --branch=${{ github.ref_name }}
