name: CREW Client Release & CI

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    name: Build CREW Client (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run Tests
        run: |
          cargo test --manifest-path launcher/Cargo.toml --lib
          cargo test --manifest-path launcher/Cargo.toml --bin crew-client

      - name: Build Release Executable
        run: |
          cargo build --release --manifest-path launcher/Cargo.toml --bin crew-client

      - name: Compute SHA-256 Checksum
        shell: pwsh
        run: |
          $exePath = "launcher/target/release/crew-client.exe"
          $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash
          Set-Content -Path "launcher/target/release/crew-client.exe.sha256" -Value "$hash  crew-client.exe"
          Write-Host "SHA256: $hash"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crew-client-windows-x64
          path: |
            launcher/target/release/crew-client.exe
            launcher/target/release/crew-client.exe.sha256

      - name: Publish GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "CREW Client ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            launcher/target/release/crew-client.exe
            launcher/target/release/crew-client.exe.sha256
